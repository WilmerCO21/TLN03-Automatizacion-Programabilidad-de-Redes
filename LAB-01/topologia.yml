name: lab-frr

topology:
  nodes:
    router1:
      kind: linux
      image: frr:10.7.1-ssh # Versión estable de FRR en contenedor
      sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.default.forwarding: 1
      binds:
        - ./config/R1.cfg:/etc/frr/frr.conf

    switch1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:L2-17.12.1
      type: l2

    PC1:
      kind: linux
      image: alpine:3.23
      exec:
        - ip add add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1 dev eth1
        - ip -6 add add 2001:168:1::10/64 dev eth1
        - ip -6 route replace default via 2001:168:1::1

    router2:
      kind: linux
      image: frr:10.7.1-ssh # Versión estable de FRR en contenedor
      sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.default.forwarding: 1
      binds:
        - ./config/R2.cfg:/etc/frr/frr.conf

    switch2:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:L2-17.12.1
      type: l2

    PC2:
      kind: linux
      image: alpine:3.23
      exec:
        - ip add add 192.168.2.10/24 dev eth1
        - ip route replace default via 192.168.2.1 dev eth1
        - ip -6 add add 2001:168:2::10/64 dev eth1
        - ip -6 route replace default via 2001:168:2::1

    router3:
      kind: linux
      image: frr:10.7.1-ssh # Versión estable de FRR en contenedor
      sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.default.forwarding: 1
      binds:
        - ./config/R3.cfg:/etc/frr/frr.conf

    switch3:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:L2-17.12.1
      type: l2

    PC3:
      kind: linux
      image: alpine:3.23
      exec:
        - ip add add 192.168.3.10/24 dev eth1
        - ip route replace default via 192.168.3.1 dev eth1
        - ip -6 add add 2001:168:3::10/64 dev eth1
        - ip -6 route replace default via 2001:168:3::1

  links:
    # Enlace entre Router 1 y Router 2
    - endpoints: [ "router1:eth1", "router2:eth1" ]
    - endpoints: [ "router1:eth3", "switch1:e0/1" ]
    - endpoints: [ "switch1:e0/2", "PC1:eth1" ]

    # Enlace entre Router 2 y Router 3
    - endpoints: [ "router2:eth2", "router3:eth1" ]
    - endpoints: [ "router2:eth3", "switch2:e0/1" ]
    - endpoints: [ "switch2:e0/2", "PC2:eth1" ]

    # Enlace entre Router 3 y Router 1
    - endpoints: [ "router3:eth2", "router1:eth2" ]
    - endpoints: [ "router3:eth3", "switch3:e0/1" ]
    - endpoints: [ "switch3:e0/2", "PC3:eth1" ]
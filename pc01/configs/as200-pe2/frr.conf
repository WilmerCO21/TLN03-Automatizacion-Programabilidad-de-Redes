frr version 10.7.1
frr defaults traditional
hostname as200-pe2
log syslog informational
!
interface eth1
 ip address 10.0.0.1/30
 ip router isis AS200
 ipv6 router isis AS200
 isis network point-to-point
 isis circuit-type level-2-only
exit
!
interface eth2
 ip address 10.0.0.5/30
 ip router isis AS200
 ipv6 router isis AS200
 isis network point-to-point
 isis circuit-type level-2-only
exit
!
interface eth3
 description TRANSITO SERVIDOR-WEB2
 ip address 198.18.200.1/30
 ipv6 address 2001:db8:ff:200::1/64
exit
!
interface lo
 ip address 172.16.1.2/32
 ipv6 address fc10:16:1::2/128
 ip router isis AS200
 ipv6 router isis AS200
 isis passive
exit
!
!
router isis AS200
 net 49.0200.0000.0000.0222.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
exit
!
!
router bgp 200
 bgp router-id 172.16.1.2
 no bgp default ipv4-unicast
 neighbor 172.16.3.1 remote-as 200
 neighbor 172.16.3.1 update-source lo
 neighbor 172.16.3.2 remote-as 200
 neighbor 172.16.3.2 update-source lo
 neighbor fc10:16:3::1 remote-as 200
 neighbor fc10:16:3::1 update-source lo
 neighbor fc10:16:3::2 remote-as 200
 neighbor fc10:16:3::2 update-source lo
 neighbor 198.18.200.2 remote-as 65102
 neighbor 198.18.200.2 description SERVIDOR-WEB2 IPv4
 neighbor 2001:db8:ff:200::2 remote-as 65102
 neighbor 2001:db8:ff:200::2 description SERVIDOR-WEB2 IPv6
 !
 address-family ipv4 unicast
  neighbor 172.16.3.1 next-hop-self
  neighbor 172.16.3.2 next-hop-self
  neighbor 198.18.200.2 activate
  neighbor 198.18.200.2 route-map WEB2-IN-V4 in
  neighbor 198.18.200.2 route-map WEB2-OUT-V4 out
  neighbor 198.18.200.2 maximum-prefix 1
  neighbor 172.16.3.1 activate
  neighbor 172.16.3.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fc10:16:3::1 next-hop-self
  neighbor fc10:16:3::2 next-hop-self
  neighbor 2001:db8:ff:200::2 activate
  neighbor 2001:db8:ff:200::2 route-map WEB2-IN-V6 in
  neighbor 2001:db8:ff:200::2 route-map WEB2-OUT-V6 out
  neighbor 2001:db8:ff:200::2 maximum-prefix 1
  neighbor fc10:16:3::1 activate
  neighbor fc10:16:3::2 activate
 exit-address-family
exit
!
!
ip prefix-list WEB2-IN-V4 seq 10 permit 203.0.113.10/32
ipv6 prefix-list WEB2-IN-V6 seq 10 permit 2001:db8:500::10/128
!
route-map WEB2-IN-V4 permit 10
 match ip address prefix-list WEB2-IN-V4
exit
!
route-map WEB2-IN-V6 permit 10
 match ipv6 address prefix-list WEB2-IN-V6
exit
!
route-map WEB2-OUT-V4 deny 100
exit
!
route-map WEB2-OUT-V6 deny 100
exit
!

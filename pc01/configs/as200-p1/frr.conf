frr version 10.7.1
frr defaults traditional
hostname as200-p1
log syslog informational
!
interface eth1
 ip address 10.0.0.22/30
exit
!
interface eth2
 ip address 10.0.0.9/30
exit
!
interface eth3
 ip address 10.0.0.14/30
exit

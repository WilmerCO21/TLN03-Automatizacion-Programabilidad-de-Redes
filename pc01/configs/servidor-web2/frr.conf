frr version 10.7.1
frr defaults traditional
hostname servidor-web2
log syslog informational
!
interface eth1
 description TRANSITO HACIA AS200-PE2
 ip address 198.18.200.2/30
 ipv6 address 2001:db8:ff:200::2/64
exit
!
ip route 10.30.0.0/24 198.18.200.1
ip route 192.0.2.0/29 198.18.200.1
ipv6 route 2001:db8:30::/64 2001:db8:ff:200::1
!
router bgp 65102
 bgp router-id 198.18.200.2
 no bgp default ipv4-unicast
 neighbor 198.18.200.1 remote-as 200
 neighbor 198.18.200.1 description AS200-PE2
 neighbor 2001:db8:ff:200::1 remote-as 200
 neighbor 2001:db8:ff:200::1 description AS200-PE2
 !
 address-family ipv4 unicast
  network 203.0.113.10/32
  neighbor 198.18.200.1 activate
  neighbor 198.18.200.1 route-map TO-PE-V4 out
  neighbor 198.18.200.1 route-map FROM-PE-V4 in
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:500::10/128
  neighbor 2001:db8:ff:200::1 activate
  neighbor 2001:db8:ff:200::1 route-map TO-PE-V6 out
  neighbor 2001:db8:ff:200::1 route-map FROM-PE-V6 in
 exit-address-family
exit
!
ip prefix-list SERVICE-V4 seq 10 permit 203.0.113.10/32
ipv6 prefix-list SERVICE-V6 seq 10 permit 2001:db8:500::10/128
!
route-map TO-PE-V4 permit 10
 match ip address prefix-list SERVICE-V4
exit
!
route-map TO-PE-V6 permit 10
 match ipv6 address prefix-list SERVICE-V6
exit
!
route-map FROM-PE-V4 deny 100
exit
!
route-map FROM-PE-V6 deny 100
exit
!

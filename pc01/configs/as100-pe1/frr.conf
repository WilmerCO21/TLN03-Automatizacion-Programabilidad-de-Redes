frr version 10.7.1
frr defaults traditional
hostname as100-pe1
log syslog informational
!
interface eth1
 ip address 10.0.0.53/30
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface eth2
 ip address 10.0.0.50/30
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface lo
 ip address 172.16.1.1/32
 ipv6 address fc10:16:1::1/128
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface eth3
 description ACCESO CPE-ISP1
 ip address 192.0.2.1/30
 ipv6 address 2001:db8:100:10::1/64
exit
!
router bgp 100
 bgp router-id 172.16.1.1
 no bgp default ipv4-unicast
 neighbor 172.16.3.1 remote-as 100
 neighbor 172.16.3.1 update-source lo
 neighbor 172.16.3.2 remote-as 100
 neighbor 172.16.3.2 update-source lo
 neighbor fc10:16:3::1 remote-as 100
 neighbor fc10:16:3::1 update-source lo
 neighbor fc10:16:3::2 remote-as 100
 neighbor fc10:16:3::2 update-source lo
 neighbor 2001:db8:100:10::2 remote-as 65001
 neighbor 2001:db8:100:10::2 description CPE-ISP1
 !
 address-family ipv4 unicast
  network 192.0.2.0/30
  neighbor 172.16.3.1 next-hop-self
  neighbor 172.16.3.2 next-hop-self
  neighbor 172.16.3.1 activate
  neighbor 172.16.3.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fc10:16:3::1 next-hop-self
  neighbor fc10:16:3::2 next-hop-self
  neighbor 2001:db8:100:10::2 activate
  neighbor 2001:db8:100:10::2 route-map CPE1-IN-V6 in
  neighbor 2001:db8:100:10::2 route-map CPE1-OUT-V6 out
  neighbor 2001:db8:100:10::2 maximum-prefix 1
  neighbor fc10:16:3::1 activate
  neighbor fc10:16:3::2 activate
 exit-address-family
exit
!
router ospf
 ospf router-id 172.16.1.1
 network 10.0.0.48/30 area 0
 network 10.0.0.52/30 area 0
 network 172.16.1.1/32 area 0
exit
!
router ospf6
 ospf6 router-id 172.16.1.1
exit
!
ipv6 prefix-list CPE1-IN-V6 seq 10 permit 2001:db8:30::/64
!
route-map CPE1-IN-V6 permit 10
 match ipv6 address prefix-list CPE1-IN-V6
exit
!
!
route-map CPE1-OUT-V6 deny 10
exit
!

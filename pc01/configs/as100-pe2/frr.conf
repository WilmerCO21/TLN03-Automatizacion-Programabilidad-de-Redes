frr version 10.7.1
frr defaults traditional
hostname as100-pe2
log syslog informational
!
interface eth1
 ip address 10.0.0.1/30
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface eth2
 ip address 10.0.0.5/30
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface lo
 ip address 172.16.1.2/32
 ipv6 address fc10:16:1::2/128
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface eth3
 description TRANSITO SERVIDOR-WEB1
 ip address 198.18.100.1/30
 ipv6 address 2001:db8:ff:100::1/64
exit
!
router bgp 100
 bgp router-id 172.16.1.2
 no bgp default ipv4-unicast
 neighbor 172.16.3.1 remote-as 100
 neighbor 172.16.3.1 update-source lo
 neighbor 172.16.3.2 remote-as 100
 neighbor 172.16.3.2 update-source lo
 neighbor fc10:16:3::1 remote-as 100
 neighbor fc10:16:3::1 update-source lo
 neighbor fc10:16:3::2 remote-as 100
 neighbor fc10:16:3::2 update-source lo
 neighbor 198.18.100.2 remote-as 65101
 neighbor 198.18.100.2 description SERVIDOR-WEB1 IPv4
 neighbor 2001:db8:ff:100::2 remote-as 65101
 neighbor 2001:db8:ff:100::2 description SERVIDOR-WEB1 IPv6
 !
 address-family ipv4 unicast
  neighbor 172.16.3.1 next-hop-self
  neighbor 172.16.3.2 next-hop-self
  neighbor 172.16.3.1 activate
  neighbor 172.16.3.2 activate
  neighbor 198.18.100.2 activate
  neighbor 198.18.100.2 route-map WEB1-IN-V4 in
  neighbor 198.18.100.2 route-map WEB1-OUT-V4 out
  neighbor 198.18.100.2 maximum-prefix 1
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fc10:16:3::1 next-hop-self
  neighbor fc10:16:3::2 next-hop-self
  neighbor fc10:16:3::1 activate
  neighbor fc10:16:3::2 activate
  neighbor 2001:db8:ff:100::2 activate
  neighbor 2001:db8:ff:100::2 route-map WEB1-IN-V6 in
  neighbor 2001:db8:ff:100::2 route-map WEB1-OUT-V6 out
  neighbor 2001:db8:ff:100::2 maximum-prefix 1
 exit-address-family
exit
!
router ospf
 ospf router-id 172.16.1.2
 network 10.0.0.0/30 area 0
 network 10.0.0.4/30 area 0
 network 172.16.1.2/32 area 0
exit
!
router ospf6
 ospf6 router-id 172.16.1.2
exit
!
!
ip prefix-list WEB1-IN-V4 seq 10 permit 203.0.113.10/32
ipv6 prefix-list WEB1-IN-V6 seq 10 permit 2001:db8:500::10/128
!
route-map WEB1-IN-V4 permit 10
 match ip address prefix-list WEB1-IN-V4
exit
!
route-map WEB1-IN-V6 permit 10
 match ipv6 address prefix-list WEB1-IN-V6
exit
!
route-map WEB1-OUT-V4 deny 100
exit
!
route-map WEB1-OUT-V6 deny 100
exit
!

frr version 10.7.1
frr defaults traditional
hostname as100-rr1
log syslog informational
!
interface eth1
 ip address 10.0.0.13/30
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface eth2
 ip address 10.0.0.17/30
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface lo
 ip address 172.16.3.1/32
 ip ospf passive
 ipv6 address fc10:16:3::1/128
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
router bgp 100
 bgp router-id 172.16.3.1
 no bgp default ipv4-unicast
 neighbor 172.16.1.1 remote-as 100
 neighbor 172.16.1.1 description neighbor ipv4 pe1
 neighbor 172.16.1.1 update-source lo
 neighbor 172.16.1.2 remote-as 100
 neighbor 172.16.1.2 description neighbor ipv4 pe2
 neighbor 172.16.1.2 update-source lo
 neighbor 172.16.3.2 remote-as 100
 neighbor 172.16.3.2 description neighbor ipv4 rr2
 neighbor 172.16.3.2 update-source lo
 neighbor 172.16.4.1 remote-as 100
 neighbor 172.16.4.1 description neighbor ipv4 p1
 neighbor 172.16.4.1 update-source lo
 neighbor 172.16.4.2 remote-as 100
 neighbor 172.16.4.2 description neighbor ipv4 p2
 neighbor 172.16.4.2 update-source lo
 neighbor 172.16.4.3 remote-as 100
 neighbor 172.16.4.3 description neighbor ipv4 p3
 neighbor 172.16.4.3 update-source lo
 neighbor 172.16.4.4 remote-as 100
 neighbor 172.16.4.4 description neighbor ipv4 p4
 neighbor 172.16.4.4 update-source lo
 neighbor 172.16.4.5 remote-as 100
 neighbor 172.16.4.5 description neighbor ipv4 p5
 neighbor 172.16.4.5 update-source lo
 neighbor 200.1.1.1 remote-as 100
 neighbor 200.1.1.1 description neighbor ipv4 borde1
 neighbor 200.1.1.1 update-source lo
 neighbor 200.1.1.2 remote-as 100
 neighbor 200.1.1.2 description neighbor ipv4 borde2
 neighbor 200.1.1.2 update-source lo
 neighbor 2001:1:1::1 remote-as 100
 neighbor 2001:1:1::1 description neighbor ipv6 borde1
 neighbor 2001:1:1::1 update-source lo
 neighbor 2001:1:1::2 remote-as 100
 neighbor 2001:1:1::2 description neighbor ipv6 borde2
 neighbor 2001:1:1::2 update-source lo
 neighbor fc10:16:1::1 remote-as 100
 neighbor fc10:16:1::1 description neighbor ipv6 pe1
 neighbor fc10:16:1::1 update-source lo
 neighbor fc10:16:1::2 remote-as 100
 neighbor fc10:16:1::2 description neighbor ipv6 pe2
 neighbor fc10:16:1::2 update-source lo
 neighbor fc10:16:3::2 remote-as 100
 neighbor fc10:16:3::2 description neighbor ipv6 rr2
 neighbor fc10:16:3::2 update-source lo
 neighbor fc10:16:4::1 remote-as 100
 neighbor fc10:16:4::1 description neighbor ipv6 p1
 neighbor fc10:16:4::1 update-source lo
 neighbor fc10:16:4::2 remote-as 100
 neighbor fc10:16:4::2 description neighbor ipv6 p2
 neighbor fc10:16:4::2 update-source lo
 neighbor fc10:16:4::3 remote-as 100
 neighbor fc10:16:4::3 description neighbor ipv6 p3
 neighbor fc10:16:4::3 update-source lo
 neighbor fc10:16:4::4 remote-as 100
 neighbor fc10:16:4::4 description neighbor ipv6 p4
 neighbor fc10:16:4::4 update-source lo
 neighbor fc10:16:4::5 remote-as 100
 neighbor fc10:16:4::5 description neighbor ipv6 p5
 neighbor fc10:16:4::5 update-source lo
 !
 address-family ipv4 unicast
  neighbor 172.16.1.1 activate
  neighbor 172.16.1.1 route-reflector-client
  neighbor 172.16.1.2 activate
  neighbor 172.16.1.2 route-reflector-client
  neighbor 172.16.3.2 activate
  neighbor 172.16.4.1 activate
  neighbor 172.16.4.1 route-reflector-client
  neighbor 172.16.4.2 activate
  neighbor 172.16.4.2 route-reflector-client
  neighbor 172.16.4.3 activate
  neighbor 172.16.4.3 route-reflector-client
  neighbor 172.16.4.4 activate
  neighbor 172.16.4.4 route-reflector-client
  neighbor 172.16.4.5 activate
  neighbor 172.16.4.5 route-reflector-client
  neighbor 200.1.1.1 activate
  neighbor 200.1.1.1 route-reflector-client
  neighbor 200.1.1.2 activate
  neighbor 200.1.1.2 route-reflector-client
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:1:1::1 activate
  neighbor 2001:1:1::1 route-reflector-client
  neighbor 2001:1:1::2 activate
  neighbor 2001:1:1::2 route-reflector-client
  neighbor fc10:16:1::1 activate
  neighbor fc10:16:1::1 route-reflector-client
  neighbor fc10:16:1::2 activate
  neighbor fc10:16:1::2 route-reflector-client
  neighbor fc10:16:3::2 activate
  neighbor fc10:16:4::1 activate
  neighbor fc10:16:4::1 route-reflector-client
  neighbor fc10:16:4::2 activate
  neighbor fc10:16:4::2 route-reflector-client
  neighbor fc10:16:4::3 activate
  neighbor fc10:16:4::3 route-reflector-client
  neighbor fc10:16:4::4 activate
  neighbor fc10:16:4::4 route-reflector-client
  neighbor fc10:16:4::5 activate
  neighbor fc10:16:4::5 route-reflector-client
 exit-address-family
exit
!
router ospf
 network 10.0.0.12/30 area 0
 network 10.0.0.16/30 area 0
 network 172.16.3.1/32 area 0
exit
!
router ospf6
exit
!
